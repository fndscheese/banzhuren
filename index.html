<!DOCTYPE html>
<html lang="zh-CN">
<head>

<title>班主任工作台</title>

<body>
<div id="app">
  <header id="topbar">
    <button id="backBtn" class="icon-btn" style="display:none" aria-label="返回"><svg viewBox="0 0 24 24" class="ic"><rect x="3" y="3" width="18" height="18" rx="6" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1.6"/><path d="M14 9 L10 12 L14 15" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <div class="brand" id="brand">班主任工作台</div>
    <div id="today" class="today"></div>
  </header>
  <main id="main"></main>
  <nav id="tabbar">
    <button class="tab active" data-view="home"><span class="tab-ico"><svg viewBox="0 0 24 24" class="ic"><path d="M4 11 L12 4.5 L20 11 Z" fill="#FFFFFF"/><rect x="6.5" y="11" width="11" height="8.5" rx="1" fill="#FFFFFF"/><rect x="10.5" y="14" width="3" height="5" fill="#84A8A8"/></svg></span><span>首页</span></button>
    <button class="tab" data-view="students"><span class="tab-ico"><svg viewBox="0 0 24 24" class="ic"><circle cx="12" cy="8.5" r="3.4" fill="#FFFFFF"/><path d="M5.5 19 C5.5 14.8 8.5 13 12 13 C15.5 13 18.5 14.8 18.5 19 Z" fill="#FFFFFF"/></svg></span><span>学生</span></button>
    <button class="tab" data-view="records"><span class="tab-ico"><svg viewBox="0 0 24 24" class="ic"><rect x="6" y="5" width="12" height="14" rx="2" fill="#FFFFFF"/><rect x="9.5" y="3.3" width="5" height="3" rx="1.2" fill="#FFFFFF"/><path d="M9 10 H15 M9 13 H15 M9 16 H13" stroke="#84A8A8" stroke-width="1.5" stroke-linecap="round"/></svg></span><span>记录</span></button>
    <button class="tab" data-view="dorms"><span class="tab-ico"><svg viewBox="0 0 24 24" class="ic"><path d="M5 14.5 V9.5 Q5 7.5 7 7.5 H16 Q18 7.5 18 9.5 V14.5" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><rect x="5" y="14.5" width="13" height="3" rx="1.5" fill="#FFFFFF"/><rect x="6.5" y="9.5" width="4" height="5" rx="1" fill="#FFFFFF"/></svg></span><span>宿舍</span></button>
    <button class="tab" data-view="tickets"><span class="tab-ico"><svg viewBox="0 0 24 24" class="ic"><rect x="6" y="4.5" width="12" height="15" rx="2" fill="#FFFFFF"/><path d="M10 4.5 V19.5 M13.5 8.5 H16 M13.5 12 H16" stroke="#84A8A8" stroke-width="1.4" stroke-linecap="round"/></svg></span><span>题库</span></button>
    <button class="tab" data-view="templates"><span class="tab-ico"><svg viewBox="0 0 24 24" class="ic"><path d="M7 4.5 H13 L17 8.5 V19.5 H7 Z" fill="#FFFFFF"/><path d="M13 4.5 V8.5 H17" fill="none" stroke="#84A8A8" stroke-width="1.4" stroke-linejoin="round"/><path d="M9.5 11 H14.5 M9.5 14 H14.5" stroke="#84A8A8" stroke-width="1.4" stroke-linecap="round"/></svg></span><span>模板</span></button>

<div id="toast"></div>
